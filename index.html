<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c7a74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nefes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Nefes Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Düzen: tek sütun, üstte sekmeler; seans açılınca tam ekran nefes küresi */
:root{
  --bg:#edf2f1; --surface:#f8fbfa; --line:#d3dfdc; --fg:#15302e; --muted:#5b7471;
  --accent:#2c7a74; --accent-soft:#d6ebe8;
  --in:#3f8fb0; --hold:#7a6aa8; --out:#2f8a6c; --wait:#9a8a5e;
  --good:#2f7d4f; --bad:#a8463f;
  --f-disp:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1819; --surface:#132324; --line:#24393a; --fg:#e3eeec; --muted:#93aaa7;
  --accent:#5fb8ae; --accent-soft:#1c3634;
  --in:#6bb3d3; --hold:#a99ad6; --out:#62c19c; --wait:#c9b680;
  --good:#6cc28e; --bad:#e08a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1819; --surface:#132324; --line:#24393a; --fg:#e3eeec; --muted:#93aaa7;
  --accent:#5fb8ae; --accent-soft:#1c3634;
  --in:#6bb3d3; --hold:#a99ad6; --out:#62c19c; --wait:#c9b680;
  --good:#6cc28e; --bad:#e08a82; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
header{padding-block:22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:300;font-size:1.9rem;letter-spacing:-.01em;margin:0}
h1 b{font-weight:600;color:var(--accent)}
.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem}
h2{font-family:var(--f-disp);font-weight:400;font-size:1.25rem;margin:0;text-wrap:balance}
nav.tabs{display:flex;gap:6px;margin:16px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button,.btn{font:inherit}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}

/* Egzersiz listesi */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ex{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.ex:hover{border-color:var(--accent)}
.ex:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ex .nm{font-family:var(--f-disp);font-weight:600;font-size:1.05rem}
.ex .ds{color:var(--muted);font-size:.88rem}
.rhythm{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.rhythm i{display:block;height:100%}
.ph-in{background:var(--in)} .ph-hold{background:var(--hold)} .ph-out{background:var(--out)} .ph-wait{background:var(--wait)}
.nums{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--fg);font-weight:600;letter-spacing:.02em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Ayar paneli */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel p{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);padding:6px 12px;border-radius:999px;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.howto{margin:0;padding-left:18px;color:var(--fg)}
.howto li{margin:2px 0}
.note{font-size:.85rem;color:var(--muted)}
.custom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.custom label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.custom input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;font-variant-numeric:tabular-nums}
.switch{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}

/* Seans ekranı */
#session{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px))}
#session .top{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#session .ttl{font-family:var(--f-disp);font-weight:600}
#session .meta{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.stage{position:relative;width:min(78vw,52vh,380px);aspect-ratio:1;max-width:100%}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.orb{position:absolute;inset:0;margin:auto;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--phc) 40%,var(--surface)),color-mix(in srgb,var(--phc) 75%,var(--bg)));
  transform:scale(.55);opacity:.9;will-change:transform}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.phase{font-family:var(--f-disp);font-weight:600;font-size:clamp(1.4rem,5.5vw,2rem);color:var(--fg)}
.hint{font-size:.9rem;color:var(--fg);opacity:.8;max-width:70%}
.count{font-family:var(--f-disp);font-weight:300;font-size:clamp(2.6rem,11vw,4.2rem);font-variant-numeric:tabular-nums;line-height:1.1}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* Tıslama */
.hiss{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 16px}
.hissbtn{all:unset;cursor:pointer;width:min(64vw,230px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--accent);color:var(--bg);font-family:var(--f-disp);text-align:center;box-shadow:0 0 0 0 var(--accent);transition:box-shadow .15s;touch-action:manipulation;max-width:100%}
.hissbtn:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
.hissbtn.live{background:var(--out)}
.hissbtn .big{font-size:2.8rem;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.hissbtn .sm{font-size:.9rem;font-weight:600;opacity:.9;max-width:80%}
.meter{width:min(320px,100%);height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--out);width:0}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.status{min-height:1.5em;text-align:center;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat .v{font-family:var(--f-disp);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat .k{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.up{color:var(--good)} .down{color:var(--bad)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right}
.x{cursor:pointer;border:0;background:transparent;color:var(--muted);font-size:1rem;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad)}
.confirm{display:flex;gap:6px;justify-content:flex-end}
.small{font-size:.8rem;padding:4px 10px;border-radius:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.empty{color:var(--muted);text-align:center;padding:18px}
.goalstrip{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%;box-sizing:border-box;margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-weight:600;font-size:.9rem}
.goalstrip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.goalstrip .bar{flex:1 1 120px;height:8px;border-radius:4px;background:var(--surface);overflow:hidden;min-width:100px}
.goalstrip .bar i{display:block;height:100%;background:var(--accent)}
.goalstrip .nums{font-size:.9rem}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);min-width:0}
.wd.today{border-color:var(--accent)}
.wd .n{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wd .col{width:14px;height:56px;border-radius:7px;background:var(--line);position:relative;overflow:hidden}
.wd .col i{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.wd.ok .col i{background:var(--good)}
.wd .m{font-size:.8rem;font-variant-numeric:tabular-nums;font-weight:600}
.wd .ck{font-size:.75rem;color:var(--good);min-height:1.1em}
.wd.future{opacity:.5}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.weeksum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600;margin:2px 0 8px}
.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat .d{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hb{display:grid;grid-template-columns:minmax(84px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:.88rem}
.hb .t{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent)}
.hb .t i.top{background:var(--hold)}
.hb .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.hb .s{color:var(--muted);font-weight:500}
.dateinp{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin-left:6px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:10px}
.mini{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:6px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.custom{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){.hissbtn{transition:none}}
header .langsw{display:flex;gap:4px}
header .langsw button{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.8rem;padding:5px 10px;border-radius:8px;letter-spacing:.04em}
header .langsw button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
header .langsw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.envnote{display:flex;flex-direction:column;gap:10px;margin:14px 0 0;padding:14px 16px;border-radius:14px;border:1px solid var(--hold);background:var(--surface)}
.envnote p{margin:0}
.envnote a.btn{text-decoration:none;display:inline-block}
.envurl{user-select:all;font-weight:600;color:var(--fg)}
.vsel{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
</style>

<div class="wrap" id="wrap" lang="tr">
  <header>
    <div>
      <h1 data-ih="h1">Nefes <b>Atölyesi</b></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="langsw" role="group" aria-label="Dil / Language">
      <button data-lang="tr" aria-pressed="true">TR</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <div class="envnote" id="envnote" hidden>
    <p data-i="envTxt"></p>
    <div class="row">
      <a class="btn pri" id="envlink" href="https://muratzorluoglu-dot.github.io/nefes-atolyesi/" target="_blank" rel="noopener" data-i="envOpen"></a>
      <button class="btn ghost small" id="envcopy" data-i="envCopy"></button>
    </div>
    <p class="note" style="margin:0"><span class="envurl">muratzorluoglu-dot.github.io/nefes-atolyesi</span> · <span data-i="envData"></span></p>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-egz" aria-selected="true" data-v="egzersiz" data-i="tabEx"></button>
    <button role="tab" id="t-tis" aria-selected="false" data-v="tislama" data-i="tabHiss"></button>
    <button role="tab" id="t-gec" aria-selected="false" data-v="gecmis" data-i="tabRep"></button>
  </nav>

  <section id="v-egzersiz">
    <button class="goalstrip" id="goalstrip"></button>
    <div class="legend">
      <span><i class="ph-in"></i><span data-i="legIn"></span></span><span><i class="ph-hold"></i><span data-i="legHold"></span></span>
      <span><i class="ph-out"></i><span data-i="legOut"></span></span><span><i class="ph-wait"></i><span data-i="legWait"></span></span>
    </div>
    <div class="grid" id="exlist"></div>
    <div id="setup" class="panel" hidden style="margin-top:16px"></div>
  </section>

  <section id="v-tislama" hidden>
    <div class="stack">
      <div class="panel">
        <h2 data-i="hissTitle"></h2>
        <ol class="howto">
          <li data-i="hiss1"></li>
          <li data-i="hiss2"></li>
          <li data-i="hiss3"></li>
        </ol>
        <div class="row">
          <span class="lbl" data-i="measure"></span>
          <div class="chips" id="modechips">
            <button class="chip" data-m="mic" aria-pressed="true" data-i="modeMic"></button>
            <button class="chip" data-m="elle" aria-pressed="false" data-i="modeHand"></button>
          </div>
        </div>
        <p class="note" id="modenote"></p>
      </div>
      <div class="panel hiss">
        <button class="hissbtn" id="hissbtn"><span class="big" id="hisst">0,0</span><span class="sm" id="hisslbl"></span></button>
        <div class="meter" id="meter" hidden><i id="meterfill"></i><b id="meterthr"></b></div>
        <div class="status" id="hissstatus" aria-live="polite"></div>
        <div class="row" id="sensrow" hidden>
          <label class="note" for="sens" data-i="sens"></label>
          <input type="range" id="sens" min="4" max="20" step="1" value="10">
        </div>
      </div>
      <div class="panel">
        <h2 data-i="progress"></h2>
        <div class="stats" id="hstats"></div>
        <div class="chart" id="hchart"></div>
      </div>
      <div class="panel">
        <h2 data-i="allMeas"></h2>
        <div id="hlist"></div>
      </div>
    </div>
  </section>

  <section id="v-gecmis" hidden>
    <div class="stack">
      <div class="panel">
        <div class="row" style="justify-content:space-between">
          <h2 data-i="weekGoal"></h2>
          <button class="btn ghost small" id="goaledit" aria-expanded="false"></button>
        </div>
        <div id="goalform" class="stack" hidden style="gap:10px">
          <div class="row"><span class="lbl" style="min-width:120px" data-i="dailyLen"></span><div class="chips" id="g-dk"></div></div>
          <div class="row"><span class="lbl" style="min-width:120px" data-i="perWeek"></span><div class="chips" id="g-gun"></div></div>
          <p class="note" id="g-ozet"></p>
        </div>
        <div id="weekview"></div>
      </div>

      <div class="panel">
        <h2 data-i="periodRep"></h2>
        <div class="chips" id="perchips"></div>
        <div class="row" id="customrange" hidden>
          <label class="note" for="r-from"><span data-i="from"></span> <input type="date" id="r-from" class="dateinp"></label>
          <label class="note" for="r-to"><span data-i="to"></span> <input type="date" id="r-to" class="dateinp"></label>
        </div>
        <div class="stats six" id="rkpi"></div>
        <div class="chart" id="rchart"></div>
      </div>

      <div class="two">
        <div class="panel"><h2 data-i="byHour"></h2><div id="rsaat"></div></div>
        <div class="panel"><h2 data-i="byWd"></h2><div id="rgun"></div></div>
      </div>

      <div class="panel"><h2 data-i="byEx"></h2><div id="regz"></div></div>
      <div class="panel"><h2 data-i="growth"></h2><p class="note" data-i="growthNote"></p><div id="rsure"></div></div>
      <div class="panel"><h2 data-i="perf"></h2><div id="rperf"></div></div>
      <div class="panel"><h2 data-i="sessions"></h2><div id="slist"></div></div>
      <p class="note" id="storenote"></p>
    </div>
  </section>
</div>

<div id="session" lang="tr" hidden>
  <div class="top">
    <span class="ttl" id="s-ttl"></span>
    <span class="meta" id="s-meta"></span>
  </div>
  <div class="stage" id="stage">
    <div class="orb" id="orb"></div>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="48" fill="none" stroke="var(--line)" stroke-width="1.2"></circle>
      <circle id="ring" cx="50" cy="50" r="48" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round"
        stroke-dasharray="301.6" stroke-dashoffset="301.6" transform="rotate(-90 50 50)"></circle>
    </svg>
    <div class="center">
      <div class="phase" id="s-phase"></div>
      <div class="count" id="s-count"></div>
      <div class="hint" id="s-hint"></div>
    </div>
  </div>
  <div class="controls" id="s-controls">
    <button class="btn" id="s-pause"></button>
    <button class="btn" id="s-sound"></button>
    <button class="btn ghost" id="s-stop" data-i="stop"></button>
  </div>
  <div class="done" id="s-done" hidden>
    <div class="phase" data-i="done"></div>
    <div class="note" id="s-sum"></div>
    <button class="btn pri" id="s-close" data-i="close"></button>
  </div>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem("nefes-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem("nefes-"+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Dil ---------- */

const store={db:null,hiss:ls.get("hiss",[]),ses:ls.get("ses",[]),ayar:Object.assign({gunDk:10,haftaGun:5},ls.get("ayar",{}))};
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use("db");
    if(!db)return;
    store.db=db;
    const load=async(k)=>{
      const snap=await db.doc("kayit/"+k).get();
      const d=snap&&(snap.data?snap.data():snap);
      return d&&Array.isArray(d.list)?d.list:null;
    };
    const [h,s]=await Promise.all([load("tislama"),load("seanslar")]);
    // Bu tarayıcıda olup db'de olmayanları birleştir
    const merge=(a,b)=>{const m=new Map();[...(a||[]),...(b||[])].forEach(x=>m.set(x.id,x));return[...m.values()].sort((x,y)=>x.t<y.t?-1:1)};
    const mh=merge(h,store.hiss), mss=merge(s,store.ses);
    const ch=mh.length!==(h||[]).length, cs=mss.length!==(s||[]).length;
    store.hiss=mh;store.ses=mss;
    if(ch)await save("hiss");
    if(cs)await save("ses");
    const as=await db.doc("kayit/ayarlar").get();
    const ad=as&&as.exists?as.data():null;
    if(ad&&ad.gunDk){store.ayar={gunDk:+ad.gunDk,haftaGun:+ad.haftaGun||5};ls.set("ayar",store.ayar)}
    else if(ls.get("ayar",null))await save("ayar");
    renderAll();
  }catch(e){console.warn("db yok",e)}
}
let saving=Promise.resolve();
function save(which){
  ls.set(which,store[which]);
  if(!store.db)return Promise.resolve();
  const path={hiss:"kayit/tislama",ses:"kayit/seanslar",ayar:"kayit/ayarlar"}[which];
  const body=which==="ayar"?Object.assign({},store.ayar):{list:store[which]};
  saving=saving.then(()=>store.db.doc(path).set(body)).catch(e=>console.warn("kayıt",e));
  return saving;
}

let unlocked=false;
function silentWav(){
  const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  const a=ac();
  if(unlocked)return; unlocked=true;
  try{const el=new Audio(silentWav());el.setAttribute("playsinline","");el.play().catch(()=>{})}catch(e){}
  try{if(a){const s=a.createBufferSource();s.buffer=a.createBuffer(1,1,22050);s.connect(a.destination);s.start(0)}}catch(e){}
}
function bell(k){
  if(!soundOn)return;const a=ac();if(!a)return;
  if(k==="tick"){ // hızlı veriş tıkı: kısa, yumuşak
    const t0=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=880;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.09,t0+.005);g.gain.exponentialRampToValueAtTime(.001,t0+.12);
    o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+.14);return;
  }
  const f={in:528,in2:660,hold:396,out:330,wait:264,free:264,pump:330,end:440}[k]||440;
  const vol=voiceOn?.12:.22;
  const t0=a.currentTime,o=a.createOscillator(),g=a.createGain(),o2=a.createOscillator(),g2=a.createGain();
  o.type="sine";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2.01;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.03);g.gain.exponentialRampToValueAtTime(.001,t0+1.8);
  g2.gain.setValueAtTime(0,t0);g2.gain.linearRampToValueAtTime(vol/4,t0+.03);g2.gain.exponentialRampToValueAtTime(.001,t0+.9);
  o.connect(g).connect(a.destination);o2.connect(g2).connect(a.destination);o.start(t0);o2.start(t0);o.stop(t0+1.9);o2.stop(t0+1);
}

function ssVoices(){try{return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(lang))}catch(e){return[]}}
function voiceScore(v){let s=0;const n=v.name;if(/natural/i.test(n))s+=6;if(/neural|online|enhanced|premium/i.test(n))s+=4;if(/google/i.test(n))s+=3;
  if(/emel|ahmet|yelda|seda|filiz|aria|jenny|sonia|libby|samantha|serena|daniel|karen/i.test(n))s+=2;if(v.localService===false)s+=1;return s}
function pickSS(){const vs=ssVoices();if(!vs.length)return null;const saved=ls.get("ssv-"+lang,"");return vs.find(v=>v.name===saved)||vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]}

    u.rate=.88;u.pitch=1;u.volume=1;lastU=u;

}

let S=null, raf=0, wake=null;
async function lockWake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){wake=null}}
function start(e){
  const p=patternOf(e).filter(x=>x[1]>0);
  if(!p.length)return;
  const cyc=p.reduce((s,x)=>s+x[1],0);
  const rounds=Math.max(1,Math.round(dur*60/cyc));
  S={e,p,cyc,rounds,round:1,idx:-1,phaseStart:0,paused:false,pauseAt:0,prep:3,begin:performance.now(),elapsed:0,scale:.55,from:.55};
  $("#s-ttl").textContent=X(e.ad);
  $("#session").hidden=false;$("#s-done").hidden=true;$("#s-controls").hidden=false;
  $("#s-pause").textContent=t("pause");$("#s-sound").textContent=soundOn?t("soundOn"):t("soundOff");
  document.body.style.overflow="hidden";
  lockWake();
  setPh("wait"); $("#s-phase").textContent=t("prep"); $("#s-hint").textContent=t("prepHint");
  say(t("startSay"));
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
function setPh(k){$("#stage").style.setProperty("--phc",`var(--${phColor(k)})`)}
function spoken(k,h,len){
  const base=X(SAY[k]);
  // İlk turda tam cümle (ipucuyla), sonraki turlarda kısa ve sakin komut
  if(S.round===1&&h&&len>=3)return base+", "+lower(h)+".";
  return base+".";
}
function nextPhase(now){
  S.idx++;
  if(S.idx>=S.p.length){S.idx=0;S.round++; if(S.round>S.rounds){finish(true);return false}}
  const [k,len,hh]=S.p[S.idx], h=X(hh);
  S.phaseStart=now; S.from=S.scale; S.stroke=0;
  setPh(k);$("#s-phase").textContent=X(PH[k]);$("#s-hint").textContent=h||"";
  bell(k); say(spoken(k,h,len)); vib(k==="hold"||k==="wait"?40:80);
  return true;
}
function target(k){return k==="in"?1:k==="in2"?1.1:k==="out"?.55:k==="free"?.72:null}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clock=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function tick(now){
  if(!S)return;
  if(S.paused){raf=requestAnimationFrame(tick);return}
  const ring=$("#ring");
  if(S.prep>0){
    const el=(now-S.begin)/1000, left=3.5-el;
    if(left<=0){S.prep=0;S.idx=-1;nextPhase(now)}
    else{$("#s-count").textContent=Math.ceil(Math.min(3,left));ring.style.strokeDashoffset=301.6*(1-el/3.5);
      $("#s-meta").textContent=F.metaPrep(S.rounds,dur)}
    raf=requestAnimationFrame(tick);return;
  }
  const [k,len]=S.p[S.idx];
  const tt=(now-S.phaseStart)/1000;
  if(tt>=len){ if(!nextPhase(S.phaseStart+len*1000))return; raf=requestAnimationFrame(tick);return}
  const fr=tt/len, tg=target(k);
  if(k==="pump"){ // saniyede bir veriş: hızlı küçül, yavaşça geri dol
    const n=Math.floor(tt), f=tt-n;
    if(n!==S.stroke){S.stroke=n;bell("tick");vib(15)}
    S.scale=f<.25?.86-(.24*f/.25):.62+.24*((f-.25)/.75);
  }else if(tg!=null)S.scale=S.from+(tg-S.from)*ease(fr);
  $("#orb").style.transform=`scale(${S.scale.toFixed(4)})`;
  ring.style.strokeDashoffset=(301.6*(1-fr)).toFixed(2);
  $("#s-count").textContent=Math.max(1,Math.ceil(len-tt));
  const done=((S.round-1)*S.cyc+S.p.slice(0,S.idx).reduce((s,x)=>s+x[1],0)+tt);
  $("#s-meta").textContent=F.meta(S.round,S.rounds,clock(Math.max(0,S.rounds*S.cyc-done)));
  S.elapsed=done;
  raf=requestAnimationFrame(tick);
}
function finish(complete){
  cancelAnimationFrame(raf);
  if(!S)return;
  const sec=Math.round(S.elapsed||0);
  if(sec>=20){
    store.ses.push({id:uid(),t:new Date().toISOString(),egz:S.e.id,ad:X(S.e.ad),sn:sec,tur:complete?S.rounds:S.round-1,cyc:S.cyc,ptn:numsTxt(S.p)});
    save("ses");renderRapor();
  }
  const bug=daySecs(store.ses).get(dk(new Date()))||0, hedef=store.ayar.gunDk*60;
  bell("end"); if(complete)say(t("endSay")); else hush();
  $("#s-controls").hidden=true;$("#s-done").hidden=false;
  $("#s-sum").textContent=(sec>=20?F.saved(Math.floor(sec/60),sec%60):t("tooShortSes")+" ")
    +(bug>=hedef?F.todayOk(ztxt(bug)):F.todayLeft(ztxt(bug),store.ayar.gunDk,ztxt(hedef-bug)));
  $("#s-phase").textContent="";$("#s-count").textContent="";$("#s-hint").textContent="";
  $("#orb").style.transform="scale(.55)";$("#ring").style.strokeDashoffset=301.6;
  S=null; try{wake&&wake.release()}catch(e){} wake=null;
}
$("#s-pause").addEventListener("click",()=>{
  if(!S)return; const now=performance.now();
  if(!S.paused){S.paused=true;S.pauseAt=now;$("#s-pause").textContent=t("resume");hush()}
  else{const d=now-S.pauseAt;S.phaseStart+=d;S.begin+=d;S.paused=false;$("#s-pause").textContent=t("pause")}

async function micStart(){
  $("#hissstatus").textContent=t("micOpening");
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("yok");
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const a=ac(); const src=a.createMediaStreamSource(stream); const an=a.createAnalyser();
    an.fftSize=2048; an.smoothingTimeConstant=.3; src.connect(an);
    const bins=new Float32Array(an.frequencyBinCount), hz=a.sampleRate/an.fftSize;
    const lo=Math.floor(2500/hz), hi=Math.min(bins.length-1,Math.floor(10000/hz));
    mic={stream,an,bins,lo,hi,floor:-90,cal:[],t0:performance.now()};
    H={state:"cal"};$("#hissbtn").classList.remove("live");$("#hisslbl").textContent=t("quiet");
    $("#hissstatus").textContent=t("calibrating");
    micLoop();
  }catch(e){
    setMode("elle"); $("#hissstatus").textContent=t("micFail");
  }
}
function micStop(){
  if(mic){try{mic.stream.getTracks().forEach(x=>x.stop())}catch(e){} mic=null}
  if(H.state==="cal"||H.state==="arm"||H.state==="run")resetHiss();
}
function level(){
  mic.an.getFloatFrequencyData(mic.bins);
  let s=0,n=0; for(let i=mic.lo;i<=mic.hi;i++){const v=mic.bins[i];if(isFinite(v)){s+=Math.pow(10,v/10);n++}}
  return n?10*Math.log10(s/n):-120;
}
const thr=()=>mic?mic.floor+(+sensEl.value):0;
function placeThr(){if(!mic)return;const pct=v=>Math.max(0,Math.min(100,(v+100)/80*100));$("#meterthr").style.left=pct(thr())+"%"}
function micLoop(){
  if(!mic)return;
  const now=performance.now(), lv=level();
  $("#meterfill").style.width=Math.max(0,Math.min(100,(lv+100)/80*100))+"%";
  if(H.state==="cal"){
    mic.cal.push(lv);
    if(now-mic.t0>1100){const srt=mic.cal.slice().sort((a,b)=>a-b);mic.floor=srt[Math.floor(srt.length*.8)]||-90;placeThr();
      H={state:"arm",above:0};$("#hisslbl").textContent=t("readyBtn");$("#hissstatus").textContent=t("readyMsg");bell("in")}
  }else if(H.state==="arm"){
    if(lv>thr()){H.above=H.above||now; if(now-H.above>150){H={state:"run",t0:H.above,last:now};$("#hissbtn").classList.add("live");$("#hisslbl").textContent=t("listening");$("#hissstatus").textContent=t("keepGoing")}}
    else H.above=0;
  }else if(H.state==="run"){
    if(lv>thr()-2)H.last=now;
    $("#hisst").textContent=fmt((H.last-H.t0)/1000);
    if(now-H.last>700){record((H.last-H.t0)/1000,"mic");return}
    if(now-H.t0>180000){record((H.last-H.t0)/1000,"mic");return}
  }else return;
  requestAnimationFrame(micLoop);
}
function record(sn,how){
  if(mic){try{mic.stream.getTracks().forEach(x=>x.stop())}catch(e){} mic=null}
  sn=Math.round(sn*10)/10;
  $("#hissbtn").classList.remove("live");
  if(sn<2){H={state:"done"};$("#hisst").textContent=fmt(sn);$("#hisslbl").textContent=t("again");
    $("#hissstatus").textContent=t("tooShortH");return}
  const prevBest=store.hiss.reduce((m,x)=>Math.max(m,x.sn),0);
  store.hiss.push({id:uid(),t:new Date().toISOString(),sn,mod:how});
  save("hiss");
  H={state:"done"};$("#hisst").textContent=fmt(sn);$("#hisslbl").textContent=t("again");
  bell("end"); vib(120);
  const rec=prevBest&&sn>prevBest;
  $("#hissstatus").textContent=F.result(fmt(sn))+(rec?F.record(fmt(prevBest)):"");
  say(F.sayRes(fmt(sn))+(rec?F.sayRec():""));
  renderHiss();renderRapor();
}

/* ---------- Tarih yardımcıları ---------- */
const day=iso=>{const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayTR=k=>{const [y,m,d]=k.split("-");return lang==="en"?`${+d}/${+m}/${y}`:`${+d}.${+m}.${y}`};
const dayShort=k=>dayTR(k).slice(0,-5);
const timeTR=iso=>new Date(iso).toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"});
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monOf=d=>{const x=sod(d);return addD(x,-((x.getDay()+6)%7))};
const dayDiff=(a,b)=>Math.round((sod(b)-sod(a))/864e5);
function ztxt(s){s=Math.round(s);if(s<=0)return "0 "+t("min");if(s<60)return s+" "+t("sec");const m=Math.round(s/60);return m<120?m+" "+t("min"):Math.floor(m/60)+" "+t("hr")+(m%60?" "+m%60+" "+t("min"):"")}
function daySecs(list){const m=new Map();list.forEach(x=>{const k=day(x.t);m.set(k,(m.get(k)||0)+x.sn)});return m}
const inR=(iso,a,b)=>{const d=new Date(iso);return d>=a&&d<b};
const pctTxt=(a,b)=>b>0?(lang==="en"?Math.round(a/b*100)+"%":"%"+Math.round(a/b*100)):"–";

/* ---------- Tıslama gelişimi ---------- */
let pendingDel=null;
function renderHiss(){
  const L2=store.hiss;
  if(!L2.length){
    $("#hstats").innerHTML=`<div class="stat" style="grid-column:1/-1"><div class="k">${t("noMeas")}</div><div class="note">${t("noMeasNote")}</div></div>`;
    $("#hchart").innerHTML="";$("#hlist").innerHTML=`<div class="empty">${t("measList")}</div>`;return;
  }
  const by=new Map(); L2.forEach(x=>{const k=day(x.t);by.set(k,Math.max(by.get(k)||0,x.sn))});
  const days=[...by.keys()].sort(); const first=by.get(days[0]), last=by.get(days[days.length-1]);
  const best=Math.max(...L2.map(x=>x.sn)); const ch=first?((last-first)/first*100):0;
  const sx=" "+t("sec");
  $("#hstats").innerHTML=[
    [t("firstDay"),fmt(first)+sx,dayTR(days[0])],
    [t("lastDay"),fmt(last)+sx,dayTR(days[days.length-1])],
    [t("best"),fmt(best)+sx,L2.length+" "+t("meas")],
    [t("change"),(ch>0?"+":"")+fmt(ch,0)+"%",(last-first>=0?"+":"")+fmt(last-first)+sx]
  ].map((s,i)=>`<div class="stat"><div class="k">${s[0]}</div><div class="v ${i===3?(ch>0?"up":ch<0?"down":""):""}">${s[1]}</div><div class="note">${s[2]}</div></div>`).join("");
  $("#hchart").innerHTML=`<div class="note" style="margin-bottom:6px">${t("dailyBest")}</div>`+
    lineSVG(days.map(k=>({l:dayShort(k),v:by.get(k),tt:`${dayTR(k)}: ${fmt(by.get(k))}${sx}`})),v=>fmt(v)+sx,t("dailyBest"));
  const rows=L2.slice().reverse().map(r=>`<tr><td>${dayTR(day(r.t))}</td><td>${timeTR(r.t)}</td><td>${r.mod==="mic"?t("mic"):t("hand")}</td><td class="r"><b>${fmt(r.sn)}</b>${sx}${r.sn===best?" ★":""}</td>
    <td class="r">${pendingDel===r.id?`<span class="confirm"><button class="btn small" data-del="${r.id}">${t("del")}</button><button class="btn small ghost" data-cancel="1">${t("cancel")}</button></span>`:`<button class="x" data-ask="${r.id}" aria-label="${t("delAria")}">✕</button>`}</td></tr>`).join("");
  $("#hlist").innerHTML=`<div class="chart"><table><thead><tr><th>${t("thDate")}</th><th>${t("thTime")}</th><th>${t("thMeas")}</th><th class="r">${t("thDur")}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $("#hlist").querySelectorAll("[data-ask]").forEach(b=>b.addEventListener("click",()=>{pendingDel=b.dataset.ask;renderHiss()}));
  $("#hlist").querySelectorAll("[data-cancel]").forEach(b=>b.addEventListener("click",()=>{pendingDel=null;renderHiss()}));
  $("#hlist").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{store.hiss=store.hiss.filter(x=>x.id!==b.dataset.del);pendingDel=null;save("hiss");renderHiss();renderRapor()}));
}

/* ---------- Grafik yardımcıları ---------- */
function niceMax(v){if(!(v>0))return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
function lineSVG(pts,vf,aria){
  const W=640,Hh=220,pl=44,pr=16,pt=20,pb=30,n=pts.length;
  const mx=niceMax(Math.max(...pts.map(p=>p.v))*1.05);
  const x=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1);
  const y=v=>pt+(Hh-pt-pb)*(1-v/mx);
  let g="";
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v,v%1?1:0)}</text>`}
  const P=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`);
  const area=n>1?`<path d="M${x(0)},${y(0)} L${P.join(" L")} L${x(n-1)},${y(0)} Z" fill="var(--accent)" opacity=".12"/>`:"";
  const line=n>1?`<polyline points="${P.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`:"";
  const step=Math.max(1,Math.ceil(n/7));
  const lab=pts.map((p,i)=>((i%step===0&&n-1-i>=step/2)||i===n-1)?`<text x="${x(i)}" y="${Hh-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.l)}</text>`:"").join("");
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===n-1?5:3}" fill="${i===n-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"><title>${esc(p.tt||p.l)}</title></circle>`).join("");
  const lv=pts[n-1].v;
  const lastLab=`<text x="${Math.min(x(n-1),W-pr-4)}" y="${y(lv)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--fg)">${esc(vf(lv))}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(aria)}">${g}${area}${line}${dots}${lab}${lastLab}</svg>`;
}
function barSVG(bk,aria){
  const W=640,Hh=230,pl=44,pr=16,pt=16,pb=30,n=bk.length;
  const mx=niceMax(Math.max(...bk.map(b=>Math.max(b.v,b.goal)))*1.08);
  const cw=(W-pl-pr)/n, bw=Math.max(2,Math.min(38,cw*.66));
  const y=v=>pt+(Hh-pt-pb)*(1-v/mx);
  let g="";
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v,v%1?1:0)}</text>`}
  const same=bk.every(b=>Math.abs(b.goal-bk[0].goal)<.01);
  let bars="",goals="",lab="";
  const step=Math.max(1,Math.ceil(n/12)), mn=" "+t("min");
  bk.forEach((b,i)=>{
    const cx=pl+cw*i+cw/2, ok=b.v>=b.goal&&b.v>0;
    if(b.v>0)bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y(b.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0)-y(b.v)).toFixed(1)}" rx="${Math.min(4,bw/3).toFixed(1)}" fill="var(--accent)" opacity="${ok?1:.42}"><title>${esc(b.tt)}: ${fmt(b.v,b.v<10&&b.v%1?1:0)}${mn}${ok?" ("+t("goalDone")+")":""}</title></rect>`;
    else bars+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${y(0)-2}" width="${bw.toFixed(1)}" height="2" fill="var(--line)" opacity="${b.fut?.5:1}"><title>${esc(b.tt)}: ${t("noData")}</title></rect>`;
    if(!same)goals+=`<line x1="${(cx-cw/2+2).toFixed(1)}" x2="${(cx+cw/2-2).toFixed(1)}" y1="${y(b.goal)}" y2="${y(b.goal)}" stroke="var(--fg)" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    if(i%step===0)lab+=`<text x="${cx.toFixed(1)}" y="${Hh-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(b.l)}</text>`;
  });
  if(same)goals=`<line x1="${pl}" x2="${W-pr}" y1="${y(bk[0].goal)}" y2="${y(bk[0].goal)}" stroke="var(--fg)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="${W-pr}" y="${y(bk[0].goal)-6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--fg)">${t("goalLbl")} ${fmt(bk[0].goal,0)}${mn}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(aria)}">${g}${bars}${goals}${lab}</svg>`;
}
function hbHTML(rows){
  const mx=Math.max(1,...rows.map(r=>r.v)), top=Math.max(...rows.map(r=>r.v));
  return `<div class="hb">${rows.map(r=>`<div>${esc(r.l)} <span class="s">${esc(r.s||"")}</span></div>
    <div class="t"><i class="${r.v>0&&r.v===top?"top":""}" style="width:${(r.v/mx*100).toFixed(1)}%"></i></div>
    <div class="v">${r.v?ztxt(r.v):"–"} <span class="s">${r.c?"· "+r.c+" "+t("sessionsWord"):""}</span></div>`).join("")}</div>`;
}

/* ---------- Hedef ve rapor ---------- */
const GDK=[5,10,15,20,30,45], GGUN=[3,4,5,6,7];
const BOLUM=[["05–11",5,11],["11–15",11,15],["15–19",15,19],["19–23",19,23],["23–05",23,5]];
const PERK=["hafta","gecen","ay","30","yil","tumu","ozel"];
function delta(now,prev,unit){
  if(!prev&&!now)return `<span class="note">${unit}</span>`;
  if(!prev)return `<span class="d up">${t("newTag")}</span> <span class="note">${unit}</span>`;
  const p=Math.round((now-prev)/prev*100);
  return `<span class="d ${p>0?"up":p<0?"down":""}">${p>0?"+":""}${p}%</span> <span class="note">${unit}</span>`;
}
let per=ls.get("per","hafta"), goalOpen=false;
function weekInfo(mon,dm){
  const g=store.ayar.gunDk*60, today=sod(new Date());
  const days=[...Array(7)].map((_,i)=>{const d=addD(mon,i),s=dm.get(dk(d))||0;return{d,s,ok:s>=g,fut:d>today,today:+d===+today}});
  return{days,tot:days.reduce((a,x)=>a+x.s,0),ok:days.filter(x=>x.ok).length};
}

  $("#g-dk").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{store.ayar.gunDk=+c.dataset.v;save("ayar");renderRapor()}));
  $("#g-gun").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{store.ayar.haftaGun=+c.dataset.v;save("ayar");renderRapor()}));
  const kalan=W.days.filter(x=>(x.fut||(x.today&&!x.ok))).length, eksik=Math.max(0,A.haftaGun-W.ok);
  const msg=W.ok>=A.haftaGun?F.wkDone():eksik>kalan?F.wkHard(kalan,eksik):F.wkLeft(eksik,A.gunDk,kalan);

  $("#weekview").innerHTML=`<div class="weeksum"><span>${F.wkSum1(Math.round(W.tot/60),A.gunDk*A.haftaGun)}</span><span>${F.wkSum2(W.ok,A.haftaGun)}</span></div>
    <div class="prog" style="margin-bottom:12px"><i style="width:${Math.min(100,W.tot/wg*100)}%"></i></div>
    <div class="week">${W.days.map((x,i)=>`<div class="wd${x.ok?" ok":""}${x.today?" today":""}${x.fut?" future":""}" title="${dayTR(dk(x.d))}">
      <span class="n">${WD[i]}</span><span class="col"><i style="height:${Math.min(100,x.s/(A.gunDk*60)*100)}%"></i></span>
      <span class="m">${x.s?Math.round(x.s/60)+"′":"–"}</span><span class="ck">${x.ok?"✓":""}</span></div>`).join("")}</div>
    <p class="note" style="margin-top:10px">${msg}</p>`;
}
function range(){
  const tday=sod(new Date());
  if(per==="hafta"){const a=monOf(tday);return[a,addD(a,7)]}
  if(per==="gecen"){const a=addD(monOf(tday),-7);return[a,addD(a,7)]}
  if(per==="ay")return[new Date(tday.getFullYear(),tday.getMonth(),1),new Date(tday.getFullYear(),tday.getMonth()+1,1)];
  if(per==="30")return[addD(tday,-29),addD(tday,1)];
  if(per==="yil")return[new Date(tday.getFullYear(),0,1),new Date(tday.getFullYear()+1,0,1)];
  if(per==="tumu"){const all=[...store.ses,...store.hiss].map(x=>new Date(x.t));const f=all.length?sod(new Date(Math.min(...all))):tday;return[f,addD(tday,1)]}
  const fv=$("#r-from").value, tv=$("#r-to").value;
  let a=fv?sod(new Date(fv+"T00:00")):addD(tday,-29), b=tv?addD(sod(new Date(tv+"T00:00")),1):addD(tday,1);
  if(a>=b)b=addD(a,1);
  return[a,b];
}
function buckets(a,b,list){
  const span=dayDiff(a,b), A=store.ayar, out=[], t1=addD(sod(new Date()),1), MO=t("mo"), WD=t("wd");
  const kind=span<=45?"gun":span<=220?"hafta":"ay";
  if(kind==="gun")for(let d=new Date(a);d<b;d=addD(d,1))out.push({a:d,b:addD(d,1),l:(d.getDate()===1||+d===+a)?`${d.getDate()} ${MO[d.getMonth()]}`:String(d.getDate()),tt:`${WD[(d.getDay()+6)%7]} ${dayTR(dk(d))}`,goal:A.gunDk});
  else if(kind==="hafta")for(let w=monOf(a);w<b;w=addD(w,7))out.push({a:w,b:addD(w,7),l:dayShort(dk(w)),tt:`${dayTR(dk(w))} ${t("weekOf")}`,goal:A.gunDk*A.haftaGun});
  else for(let m=new Date(a.getFullYear(),a.getMonth(),1);m<b;m=new Date(m.getFullYear(),m.getMonth()+1,1)){
    const e=new Date(m.getFullYear(),m.getMonth()+1,1);
    out.push({a:m,b:e,l:MO[m.getMonth()]+(m.getMonth()===0||+m<=+a?" "+String(m.getFullYear()).slice(2):""),tt:`${MO[m.getMonth()]} ${m.getFullYear()}`,goal:A.gunDk*A.haftaGun*dayDiff(m,e)/7});
  }
  out.forEach(k=>{k.v=list.filter(x=>inR(x.t,k.a>a?k.a:a,k.b<b?k.b:b)).reduce((s,x)=>s+x.sn,0)/60;k.fut=k.a>=t1});
  return{kind,out};
}
function renderRapor(){
  renderGoal();
  const A=store.ayar, g=A.gunDk*60, PL=t("per");
  $("#perchips").innerHTML=PERK.map((k,i)=>`<button class="chip" data-p="${k}" aria-pressed="${k===per}">${PL[i]}</button>`).join("");

  $("#customrange").hidden=per!=="ozel";

  const pa=addD(a,-dayDiff(a,b)), pe=addD(pa,nDays);
  const P2=store.ses.filter(x=>inR(x.t,pa,pe)), ptot=P2.reduce((s,x)=>s+x.sn,0);

  let goalDays=0; for(let d=new Date(a);d<end;d=addD(d,1))if((dm.get(dk(d))||0)>=g)goalDays++;
  let pGoal=0; for(let d=new Date(pa);d<pe;d=addD(d,1))if((dmAll.get(dk(d))||0)>=g)pGoal++;
  let wN=0,wHit=0,wCur=false; for(let w=monOf(a);w<end;w=addD(w,7)){const W=weekInfo(w,dmAll);const done=addD(w,7)<=t1;if(W.ok>=A.haftaGun){wHit++;wN++}else if(done)wN++;else wCur=true}
  let seri=0;{let d=sod(new Date());if((dmAll.get(dk(d))||0)<g)d=addD(d,-1);while((dmAll.get(dk(d))||0)>=g){seri++;d=addD(d,-1)}}
  let enUzun=0;{const ks=[...dmAll.keys()].filter(k=>dmAll.get(k)>=g).sort();let r=0,prev=null;ks.forEach(k=>{const d=new Date(k+"T00:00");r=(prev&&dayDiff(prev,d)===1)?r+1:1;prev=d;enUzun=Math.max(enUzun,r)})}
  $("#rkpi").innerHTML=[
    [t("kTot"),ztxt(tot),delta(tot,ptot,t("vsPrev"))],
    [t("kSes"),S2.length,S2.length?`<span class="note">${t("avg")} ${ztxt(tot/S2.length)}</span>`:""],
    [t("kAct"),`${dm.size} / ${nDays}`,`<span class="note">${pctTxt(dm.size,nDays)} ${t("ofDays")}</span>`],
    [t("kDg"),`${goalDays} / ${nDays}`,delta(goalDays,pGoal,F.dgSub(A.gunDk))],
    [t("kWg"),`${wHit} / ${wN||0}`,`<span class="note">${F.wgSub(A.haftaGun)}${wCur?" · "+t("weekRunning"):""}</span>`],
    [t("kStreak"),`${seri} ${t("days")}`,`<span class="note">${t("longest")} ${enUzun} ${t("days")}</span>`]
  ].map(s=>`<div class="stat"><div class="k">${s[0]}</div><div class="v">${s[1]}</div><div>${s[2]}</div></div>`).join("");
  const B=buckets(a,b,S2);
  $("#rchart").innerHTML=`<div class="note" style="margin:4px 0 6px">${t("chartHead")[B.kind]} ${t("chartNote")}</div>`+barSVG(B.out,PL[PERK.indexOf(per)]);
  const PN=t("parts");

  const topB=rs.slice().sort((p,q)=>q.v-p.v)[0];

function renderSure(){
  const L3=store.ses;
  if(!L3.length){$("#rsure").innerHTML=`<div class="empty">${t("noSes")}</div>`;return}
  const first=monOf(new Date(Math.min(...L3.map(x=>new Date(x.t))))), cw=monOf(new Date());
  const wk=[];for(let w=first;w<=cw;w=addD(w,7)){const e=addD(w,7);wk.push({w,v:L3.filter(x=>inR(x.t,w,e)).reduce((s,x)=>s+x.sn,0)})}
  const avg=(arr)=>arr.length?arr.reduce((s,x)=>s+x,0)/arr.length:0;
  const n=Math.min(4,Math.floor(wk.length/2))||1;
  const ilk=avg(wk.slice(0,n).map(x=>x.v)), son=avg(wk.slice(-n).map(x=>x.v));
  const k=Math.min(5,Math.floor(L3.length/2))||1;
  const sIlk=avg(L3.slice(0,k).map(x=>x.sn)), sSon=avg(L3.slice(-k).map(x=>x.sn));
  const ch=(p,q)=>p>0?`<span class="${q>=p?"up":"down"}">${q>=p?"+":""}${Math.round((q-p)/p*100)}%</span>`:"";
  $("#rsure").innerHTML=`<div class="cmp">
    <div class="stat"><div class="k">${t("sTot")}</div><div class="v">${ztxt(ilk)} → ${ztxt(son)}</div><div class="note">${wk.length>1?F.firstN(n)+ch(ilk,son):t("firstWeek")}</div></div>
    <div class="stat"><div class="k">${t("sLen")}</div><div class="v">${ztxt(sIlk)} → ${ztxt(sSon)}</div><div class="note">${L3.length>1?F.firstS(k)+ch(sIlk,sSon):t("single")}</div></div>
    <div class="stat"><div class="k">${t("sAll")}</div><div class="v">${ztxt(L3.reduce((s,x)=>s+x.sn,0))}</div><div class="note">${F.totSub(L3.length,wk.length)}</div></div>
  </div>`+(wk.length>1?lineSVG(wk.map(x=>({l:dayShort(dk(x.w)),v:x.v/60,tt:`${dayTR(dk(x.w))} ${t("weekOf")}: ${ztxt(x.v)}`})),v=>fmt(v,0)+" "+t("min"),t("growth")):"");
}
function renderPerf(a,b){
  const H2=store.hiss, P=H2.filter(x=>inR(x.t,a,b)), sx=" "+t("sec");
  let html=`<p class="note" style="margin-bottom:10px">${t("perfInfo")}`;
  if(H2.length){
    const f0=H2[0], best=H2.reduce((m,x)=>x.sn>m.sn?x:m,H2[0]);
    const ch=f0.sn?`, <span class="${best.sn>=f0.sn?"up":"down"}">${best.sn>=f0.sn?"+":""}${Math.round((best.sn-f0.sn)/f0.sn*100)}%</span>`:"";
    html+=F.sinceStart(fmt(f0.sn),dayTR(day(f0.t)),fmt(best.sn),dayTR(day(best.t)),ch);
  }
  html+="</p>";
  if(P.length){
    const by=new Map();P.forEach(x=>{const k=day(x.t);by.set(k,Math.max(by.get(k)||0,x.sn))});
    const days=[...by.keys()].sort(), fv=by.get(days[0]), lv=by.get(days[days.length-1]), bv=Math.max(...P.map(x=>x.sn));
    const ch=fv?Math.round((lv-fv)/fv*100):0;
    html+=`<div class="stats" style="margin-bottom:10px">${[
      [t("pStart"),fmt(fv)+sx,dayTR(days[0])],[t("pEnd"),fmt(lv)+sx,dayTR(days[days.length-1])],
      [t("pBest"),fmt(bv)+sx,P.length+" "+t("meas")],[t("pCh"),(ch>0?"+":"")+ch+"%",(lv-fv>=0?"+":"")+fmt(lv-fv)+sx]
    ].map((s,i)=>`<div class="stat"><div class="k">${s[0]}</div><div class="v ${i===3?(ch>0?"up":ch<0?"down":""):""}">${s[1]}</div><div class="note">${s[2]}</div></div>`).join("")}</div>`;
    if(days.length>1)html+=lineSVG(days.map(k=>({l:dayShort(k),v:by.get(k),tt:`${dayTR(k)}: ${fmt(by.get(k))}${sx}`})),v=>fmt(v)+sx,t("perf"));
  }else html+=`<div class="empty">${t("noHissP")}</div>`;
  const oz=store.ses.filter(x=>x.egz==="ozel"&&x.cyc);
  if(oz.length>1){const f=oz[0],l=oz[oz.length-1];
    html+=`<p class="note" style="margin-top:10px">${F.custProg(fmt(f.cyc,f.cyc%1?1:0),esc(f.ptn||""),fmt(l.cyc,l.cyc%1?1:0),esc(l.ptn||""))}</p>`}
  $("#rperf").innerHTML=html;
}
