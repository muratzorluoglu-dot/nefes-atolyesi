<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c7a74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nefes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Nefes Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Sessiz Lüks + Organik Minimalizm.
   Düzen: telefonda üst başlık + alt gezinme (başparmak bölgesi); masaüstünde sol kenar çubuğu + ölçülü içerik alanı.
   Gündüz: fildişi zemin, gece mavisi metin, adaçayı vurgu. Gece: derin lacivert zemin, fildişi metin, lavanta vurgu. */
:root{
  /* Marka paleti */
  --ivory:#F5F2EB; --sage:#A5B5A0; --lavender:#C9BEDF; --sand:#D5C6B4; --night-blue:#222D40; --night:#171D27;
  /* Anlamsal tokenlar: gündüz */
  --bg:#F5F2EB; --surface:#FBF9F4; --surface-2:#EEE9DF; --line:#E3DCCF; --line-strong:#CFC6B6;
  --fg:#222D40; --muted:#5D6570; --faint:#8A8F96;
  --accent:#58744F; --accent-soft:#E1E7DC; --accent-ink:#F5F2EB;
  --btn:#222D40; --btn-ink:#F5F2EB;
  --orb:#A5B5A0; --orb-2:#C9D3C4; --halo:#DCE3D7;
  --in:#8FA9B4; --hold:#B2A5CF; --out:#93A98D; --wait:#C4B39B;
  --good:#4D7A52; --bad:#A0564C; --scrim:rgba(23,29,39,.55);
  --shadow:0 1px 2px rgba(34,45,64,.05),0 8px 28px rgba(34,45,64,.07);
  /* Tipografi */
  --f-disp:"Fraunces",ui-serif,Georgia,"Times New Roman",serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-xs:.8125rem; --fs-sm:.9rem; --fs-md:1rem; --fs-lg:1.2rem;
  --fs-h2:clamp(1.3rem,1.15rem + .6vw,1.6rem); --fs-display:clamp(2.1rem,1.5rem + 2.6vw,3.4rem);
  /* Boşluk, köşe */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-sm:10px; --r-md:14px; --r-lg:22px;
  --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171D27; --surface:#1D2431; --surface-2:#222D40; --line:#2C3547; --line-strong:#3B4558;
  --fg:#ECE7DD; --muted:#A7AEBA; --faint:#7D8594;
  --accent:#C9BEDF; --accent-soft:#2B2D44; --accent-ink:#171D27;
  --btn:#C9BEDF; --btn-ink:#171D27;
  --orb:#B3A8CC; --orb-2:#8F86AC; --halo:#2A3145;
  --in:#8EB0BF; --hold:#C9BEDF; --out:#A5B5A0; --wait:#D5C6B4;
  --good:#9CC3A0; --bad:#E2A49B; --scrim:rgba(8,11,16,.7);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171D27; --surface:#1D2431; --surface-2:#222D40; --line:#2C3547; --line-strong:#3B4558;
  --fg:#ECE7DD; --muted:#A7AEBA; --faint:#7D8594;
  --accent:#C9BEDF; --accent-soft:#2B2D44; --accent-ink:#171D27;
  --btn:#C9BEDF; --btn-ink:#171D27;
  --orb:#B3A8CC; --orb-2:#8F86AC; --halo:#2A3145;
  --in:#8EB0BF; --hold:#C9BEDF; --out:#A5B5A0; --wait:#D5C6B4;
  --good:#9CC3A0; --bad:#E2A49B; --scrim:rgba(8,11,16,.7);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs-md);line-height:1.55;margin:0;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:15;background:var(--bg)}
button{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.fill{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--accent-soft)}

/* ---------- Uygulama iskeleti ---------- */
.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding-block:var(--s4) var(--s2);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:400;font-size:1.15rem;letter-spacing:-.005em;white-space:nowrap}
.brand .mark{width:28px;height:28px;flex:none}
.topbar .brand{min-width:0}
.topbar .brand span{overflow:hidden;text-overflow:ellipsis}
.bottomnav{min-width:0}
.bottomnav .navbtn{min-width:0;overflow:hidden}
@media (max-width:359px){.topbar{gap:6px}.topbar .brand{font-size:1rem}.topbar .langsw button{min-width:32px}.tools{gap:2px}}
.tools{display:flex;align-items:center;gap:6px}
.main{min-width:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-block:var(--s2) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.main>section{max-width:1080px;margin:0 auto;animation:viewin .45s ease both}
@keyframes viewin{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.navbtn{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border-radius:12px;
  color:var(--faint);font-size:.72rem;font-weight:600;letter-spacing:.01em;text-align:center;transition:color .2s}
.navbtn[aria-current="page"]{color:var(--fg)}
.navbtn[aria-current="page"] svg{stroke-width:1.9}
.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#ver{max-width:1080px;margin:var(--s6) auto 0;text-align:center;color:var(--faint);font-size:var(--fs-xs)}

@media (min-width:960px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .topbar,.bottomnav{display:none}
  .side{display:flex;flex-direction:column;gap:var(--s6);position:sticky;top:0;height:100vh;
    padding:calc(env(safe-area-inset-top,0px) + 32px) 20px 24px max(24px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
  .sidenav{display:flex;flex-direction:column;gap:2px}
  .side .navbtn{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding:0 12px;font-size:.95rem;font-weight:600;color:var(--muted)}
  .side .navbtn:hover{background:var(--surface-2);color:var(--fg)}
  .side .navbtn[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--s3)}
  .main{padding-block:calc(env(safe-area-inset-top,0px) + 40px) 48px;padding-left:clamp(32px,4vw,64px);padding-right:max(clamp(32px,4vw,64px),env(safe-area-inset-right,0px))}
}

/* ---------- Temel bileşenler ---------- */
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.display{font-family:var(--f-disp);font-weight:300;font-size:var(--fs-display);line-height:1.08;letter-spacing:-.015em}
h2,.h2{font-family:var(--f-disp);font-weight:400;font-size:var(--fs-h2);line-height:1.25;letter-spacing:-.005em}
.eyebrow,.lbl,.grphead{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0}
.lede{color:var(--muted);font-size:var(--fs-lg);margin:var(--s2) 0 0;max-width:40ch}
.note{font-size:var(--fs-sm);color:var(--muted)}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:var(--s5)}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;gap:var(--s4)}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);flex-wrap:wrap;margin:0 0 var(--s4)}
.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;
  border:1px solid var(--line-strong);background:transparent;color:var(--fg);font-weight:600;font-size:.95rem;text-decoration:none;transition:background .2s,border-color .2s,transform .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{background:color-mix(in srgb,var(--btn) 88%,var(--bg))}
.btn.ghost{border-color:transparent}
.btn.small{min-height:36px;padding:0 14px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--muted);transition:background .2s,color .2s}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{cursor:pointer;min-height:38px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);padding:0 14px;border-radius:999px;font-weight:600;font-size:.875rem;transition:background .2s,border-color .2s}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.langsw{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2)}
.langsw button{cursor:pointer;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.75rem;letter-spacing:.06em;min-width:38px;height:30px;border-radius:999px}
.langsw button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.empty{color:var(--muted);text-align:center;padding:var(--s5) var(--s3)}
.up{color:var(--good)} .down{color:var(--bad)}
.howto{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.switch{display:inline-flex;gap:10px;align-items:center;font-size:.95rem;cursor:pointer;min-height:44px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.vsel,.dateinp,.custom input{font:inherit;min-height:42px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);max-width:100%}
.dateinp{margin-left:6px}

/* ---------- Ana ekran ---------- */
.hello{padding-block:var(--s4) var(--s5)}
.hello .eyebrow{margin-bottom:var(--s3)}
.hero{display:grid;gap:var(--s5);align-items:center;background:var(--surface);border-radius:28px;padding:clamp(20px,4vw,48px)}
.breathorb{all:unset;cursor:pointer;position:relative;justify-self:center;width:min(50vw,210px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%}
.breathorb:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.breathorb .r{position:absolute;border-radius:50%;background:var(--halo)}
.breathorb .r3{inset:0;opacity:.45}
.breathorb .r2{inset:11%;opacity:.7}
.breathorb .r1{inset:22%;background:var(--orb-2);opacity:.55}
.breathorb .core{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--orb) 72%,var(--surface)),var(--orb));
  display:grid;place-items:center;color:var(--night-blue);font-family:var(--f-disp);font-size:clamp(1rem,.9rem + .5vw,1.25rem)}
.breathorb .r,.breathorb .core{animation:breathe 10s ease-in-out infinite}
.breathorb .r3{animation-delay:-.4s}.breathorb .r2{animation-delay:-.2s}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.04)}}
.herotxt{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.herotxt .h2{font-size:clamp(1.6rem,1.3rem + 1.2vw,2.2rem);font-weight:300}
.herotxt .why{color:var(--accent);font-weight:600;font-size:var(--fs-sm)}
.homegrid{display:grid;gap:var(--s4);margin-top:var(--s4);grid-template-columns:minmax(0,1fr)}
.block{background:var(--surface);border-radius:var(--r-lg);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.block .h2{font-size:1.25rem}
.todayrow{display:flex;align-items:center;gap:var(--s4)}
.ringsvg{width:84px;height:84px;flex:none}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dots span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.7rem;color:var(--faint);font-weight:600}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);display:block}
.dots .some i{background:color-mix(in srgb,var(--accent) 35%,transparent);border-color:transparent}
.dots .ok i{background:var(--accent);border-color:var(--accent)}
.dots .today{color:var(--fg)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:var(--fs-sm);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.quick{display:flex;flex-direction:column}
.quick button{all:unset;cursor:pointer;display:flex;align-items:center;gap:var(--s3);min-height:56px;border-top:1px solid var(--line);padding:4px 0}
.quick button:first-child{border-top:0}
.quick .qn{flex:1;min-width:0;display:flex;flex-direction:column}
.quick .qn b{font-weight:600}
.quick .qn span{font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.quick .qp{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--fg);flex:none}
.quick button:hover .qp{background:var(--btn);color:var(--btn-ink)}
.quick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.bignum{font-family:var(--f-disp);font-weight:300;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
#h-exds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:719px){.hello{padding-block:4px 16px}.hero{gap:16px;padding:20px}.herotxt{gap:10px}}
@media (min-width:720px){
  .breathorb{width:min(34vw,320px)}
  #h-exds{display:block}
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
  .homegrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- Egzersiz kütüphanesi ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0 0 var(--s4)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.listbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 var(--s4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:var(--s4)}
.grphead{grid-column:1/-1;margin-top:var(--s3)}
.ex{position:relative;display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);min-width:0;transition:transform .25s ease,box-shadow .25s ease}
.ex:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.exopen{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:20px 52px 20px 20px;border-radius:var(--r-lg);flex:1}
.exopen:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.editing .exopen{cursor:default}
.editing .ex:hover{transform:none;box-shadow:none}
.ex .nm{font-family:var(--f-disp);font-weight:400;font-size:1.2rem;line-height:1.25}
.ex .ds{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rhythm{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:3px}
.rhythm i{display:block;height:100%;border-radius:3px}
.ph-in{background:var(--in)} .ph-hold{background:var(--hold)} .ph-out{background:var(--out)} .ph-wait{background:var(--wait)}
.nums{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vtag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-size:.72rem;font-weight:700}
.vtag svg{width:12px;height:12px}
.star{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--faint);cursor:pointer;display:grid;place-items:center}
.star[aria-pressed="true"]{color:var(--accent)}
.star:hover{background:var(--surface-2)}
.mv{display:flex;gap:8px;padding:0 20px 16px}
.mv button{flex:1;cursor:pointer;min-height:40px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);border-radius:999px;display:grid;place-items:center}
.mv button:disabled{opacity:.3;cursor:default}

/* ---------- Egzersiz ayrıntı paneli (telefonda alttan, masaüstünde ortada) ---------- */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);animation:fade .25s ease both}
.sheet-card{position:relative;width:100%;max-height:min(90vh,900px);overflow:auto;overscroll-behavior:contain;background:var(--surface);
  border-radius:24px 24px 0 0;padding:28px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
.sheet-card::before{content:"";position:absolute;top:10px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line-strong)}
.sheet-x{position:absolute;top:10px;right:10px}
#setup{display:flex;flex-direction:column;gap:var(--s4)}
#setup h2{font-size:clamp(1.5rem,1.3rem + 1vw,2rem);font-weight:300;padding-right:44px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
@media (min-width:720px){
  .sheet{align-items:center;padding:24px}
  .sheet-card{max-width:600px;border-radius:24px;padding:36px 36px 32px}
  .sheet-card::before{display:none}
}
.custom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.custom label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.custom input{width:100%;font-variant-numeric:tabular-nums}
.vidbtn{display:flex;align-items:center;gap:14px;width:100%;cursor:pointer;text-align:left;text-decoration:none;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;min-height:56px}
.vidbtn:hover{border-color:var(--line-strong)}
.vidbtn .pl{flex:none;width:40px;height:40px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center}
.vidbtn .pl svg{width:16px;height:16px;margin-left:2px}
.vidbtn .vt{display:flex;flex-direction:column;min-width:0}
.vidbtn .vt b{font-weight:600}
.startrow{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s2)}
.startrow .btn.pri{flex:1 1 200px;min-height:52px;font-size:1rem}

/* ---------- Video penceresi ---------- */
#vidmodal{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));animation:fade .2s ease both}
.vbox{background:var(--surface);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;max-width:100%}
.vframe{position:relative;border-radius:14px;overflow:hidden;background:var(--night);max-width:100%}
.vframe.v{width:min(88vw,calc((100vh - 130px)*9/16),420px);aspect-ratio:9/16}
.vframe.h{width:min(92vw,760px);aspect-ratio:16/9}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px}
.vbar .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Nefes oynatma ekranı ---------- */
#session{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));animation:fade .5s ease both}
.s-top{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.s-top .eyebrow{letter-spacing:.14em}
.stage{position:relative;width:min(80vw,54vh,440px);aspect-ratio:1;max-width:100%;--s:.55}
.stage .halo{position:absolute;inset:0;margin:auto;border-radius:50%;background:var(--phc);will-change:transform,opacity;transition:background-color .8s}
.stage .h1{opacity:.12;transform:scale(calc(var(--s) * 1.32))}
.stage .h2{opacity:.18;transform:scale(calc(var(--s) * 1.16))}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.orb{position:absolute;inset:0;margin:auto;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--phc) 55%,var(--surface)),color-mix(in srgb,var(--phc) 88%,var(--bg)));
  transform:scale(.55);will-change:transform}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;gap:2px}
.phase{font-family:var(--f-disp);font-weight:400;font-size:clamp(1.5rem,1.2rem + 1.6vw,2.2rem);color:var(--fg)}
.count{font-family:var(--f-disp);font-weight:300;font-size:clamp(2.8rem,2rem + 4vw,4.6rem);font-variant-numeric:tabular-nums;line-height:1.05;color:var(--fg)}
.hint{font-size:.95rem;color:var(--fg);opacity:.78;max-width:62%}
.s-bottom{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px}
.playbtn{cursor:pointer;width:76px;height:76px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.playbtn:active{transform:scale(.96)}
.playbtn svg{width:28px;height:28px}
.s-prog{width:100%;display:flex;flex-direction:column;gap:8px}
.s-prog .bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.s-prog .bar i{display:block;height:100%;width:0;background:var(--fg);opacity:.7}
.s-prog .meta{display:flex;justify-content:center;color:var(--muted);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-width:420px}
.done .ck{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.done .ck svg{width:30px;height:30px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .stage .halo{display:none}
}

/* ---------- Tıslama ---------- */
.hiss{align-items:center;gap:18px;padding-block:32px}
.hissbtn{all:unset;cursor:pointer;width:min(64vw,240px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:var(--orb);color:var(--night-blue);text-align:center;box-shadow:0 0 0 14px var(--halo),0 0 0 30px color-mix(in srgb,var(--halo) 50%,transparent);touch-action:manipulation;max-width:100%;transition:background .3s}
.hissbtn:focus-visible{outline:2px solid var(--accent);outline-offset:36px}
.hissbtn.live{background:var(--in)}
.hissbtn .big{font-family:var(--f-disp);font-size:3rem;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.hissbtn .sm{font-size:.9rem;font-weight:600;max-width:80%}
.meter{width:min(320px,100%);height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;margin-top:18px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.status{min-height:1.5em;text-align:center;color:var(--muted);font-weight:600;max-width:46ch}
#sens{accent-color:var(--accent)}

/* ---------- İlerleme ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.stat{padding:14px 14px 14px 0;min-width:0;border-bottom:1px solid var(--line)}
.stat .v{font-family:var(--f-disp);font-weight:300;font-size:1.65rem;font-variant-numeric:tabular-nums;line-height:1.2;margin:4px 0 2px}
.stat .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.stat .d{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border-top:1px solid var(--line);margin-bottom:12px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{font-family:var(--f-body)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.x{cursor:pointer;border:0;background:transparent;color:var(--faint);width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center}
.x:hover{color:var(--bad);background:var(--surface-2)}
.confirm{display:flex;gap:6px;justify-content:flex-end}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:14px;min-width:0}
.wd.today{background:var(--surface-2)}
.wd .n{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.wd .col{width:10px;height:64px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.wd .col i{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:5px}
.wd.ok .col i{background:var(--accent)}
.wd .m{font-size:.8rem;font-variant-numeric:tabular-nums;font-weight:600}
.wd .ck{color:var(--accent);min-height:16px;display:grid;place-items:center}
.wd .ck svg{width:14px;height:14px}
.wd.future{opacity:.45}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.weeksum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600;margin:2px 0 8px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5)}
.hb{display:grid;grid-template-columns:minmax(84px,auto) 1fr auto;gap:10px 12px;align-items:center;font-size:.9rem}
.hb .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--out);border-radius:4px}
.hb .t i.top{background:var(--hold)}
.hb .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.hb .s{color:var(--muted);font-weight:500}
.mini{display:inline-block;height:5px;border-radius:3px;background:var(--out);vertical-align:middle;margin-right:8px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}.stats,.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}.custom{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:360px){.wd .m{font-size:.7rem}.week{gap:2px}}
</style>

const store={db:null,hiss:ls.get("hiss",[]),ses:ls.get("ses",[]),ayar:Object.assign({gunDk:10,haftaGun:5,fav:[],sira:[]},ls.get("ayar",{}))};
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use("db");
    if(!db)return;
    store.db=db;
    const load=async(k)=>{
      const snap=await db.doc("kayit/"+k).get();
      const d=snap&&(snap.data?snap.data():snap);
      return d&&Array.isArray(d.list)?d.list:null;
    };
    const [h,s]=await Promise.all([load("tislama"),load("seanslar")]);
    // Bu tarayıcıda olup db'de olmayanları birleştir
    const merge=(a,b)=>{const m=new Map();[...(a||[]),...(b||[])].forEach(x=>m.set(x.id,x));return[...m.values()].sort((x,y)=>x.t<y.t?-1:1)};
    const mh=merge(h,store.hiss), mss=merge(s,store.ses);
    const ch=mh.length!==(h||[]).length, cs=mss.length!==(s||[]).length;
    store.hiss=mh;store.ses=mss;
    if(ch)await save("hiss");
    if(cs)await save("ses");
    const as=await db.doc("kayit/ayarlar").get();
    const ad=as&&as.exists?as.data():null;
    if(ad&&ad.gunDk){store.ayar={gunDk:+ad.gunDk,haftaGun:+ad.haftaGun||5,fav:Array.isArray(ad.fav)?ad.fav:store.ayar.fav,sira:Array.isArray(ad.sira)?ad.sira:store.ayar.sira};ls.set("ayar",store.ayar)}
    else if(ls.get("ayar",null))await save("ayar");
    renderAll();
  }catch(e){console.warn("db yok",e)}
}
let saving=Promise.resolve();
function save(which){
  ls.set(which,store[which]);
  if(!store.db)return Promise.resolve();
  const path={hiss:"kayit/tislama",ses:"kayit/seanslar",ayar:"kayit/ayarlar"}[which];
  const body=which==="ayar"?Object.assign({},store.ayar):{list:store[which]};
  saving=saving.then(()=>store.db.doc(path).set(body)).catch(e=>console.warn("kayıt",e));
  return saving;
}

function silentWav(){
  const n=800,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);

}

function bell(k){
  if(!soundOn)return;const a=ac();if(!a)return;
  if(k==="tick"){ // hızlı veriş tıkı: kısa, yumuşak
    const t0=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=880;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.09,t0+.005);g.gain.exponentialRampToValueAtTime(.001,t0+.12);
    o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+.14);return;
  }
  const f={in:528,in2:660,hold:396,out:330,wait:264,free:264,pump:330,end:440}[k]||440;
  const vol=voiceOn?.12:.22;
  const t0=a.currentTime,o=a.createOscillator(),g=a.createGain(),o2=a.createOscillator(),g2=a.createGain();
  o.type="sine";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2.01;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.03);g.gain.exponentialRampToValueAtTime(.001,t0+1.8);
  g2.gain.setValueAtTime(0,t0);g2.gain.linearRampToValueAtTime(vol/4,t0+.03);g2.gain.exponentialRampToValueAtTime(.001,t0+.9);
  o.connect(g).connect(a.destination);o2.connect(g2).connect(a.destination);o.start(t0);o2.start(t0);o.stop(t0+1.9);o2.stop(t0+1);
}

/* ---------- Seans motoru ---------- */
let S=null, raf=0, wake=null;
async function lockWake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){wake=null}}
function start(e){
  const p=patternOf(e).filter(x=>x[1]>0);
  if(!p.length)return;
  const cyc=p.reduce((s,x)=>s+x[1],0);
  const rounds=Math.max(1,Math.round(dur*60/cyc));
  S={e,p,cyc,rounds,round:1,idx:-1,phaseStart:0,paused:false,pauseAt:0,prep:3,begin:performance.now(),elapsed:0,scale:.55,from:.55};
  $("#s-ttl").textContent=X(e.ad);
  $("#session").hidden=false;$("#s-done").hidden=true;$("#s-controls").hidden=false;
  setPauseBtn(false);setSoundBtn();$("#s-bar").style.width="0%";
  document.body.style.overflow="hidden";
  lockWake();
  setPh("wait"); $("#s-phase").textContent=t("prep"); $("#s-hint").textContent=t("prepHint");
  say(t("startSay"));
  cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
}
function setPh(k){$("#stage").style.setProperty("--phc",`var(--${phColor(k)})`)}
function spoken(k,h,len){
  const base=X(SAY[k]);
  // İlk turda tam cümle (ipucuyla), sonraki turlarda kısa ve sakin komut
  if(S.round===1&&h&&len>=3)return base+", "+lower(h)+".";
  return base+".";
}
function nextPhase(now){
  S.idx++;
  if(S.idx>=S.p.length){S.idx=0;S.round++; if(S.round>S.rounds){finish(true);return false}}
  const [k,len,hh]=S.p[S.idx], h=X(hh);
  S.phaseStart=now; S.from=S.scale; S.stroke=0;
  setPh(k);$("#s-phase").textContent=X(PH[k]);$("#s-hint").textContent=h||"";
  bell(k); say(spoken(k,h,len)); vib(k==="hold"||k==="wait"?40:80);
  return true;
}
function target(k){return k==="in"?1:k==="in2"?1.1:k==="out"?.55:k==="free"?.72:null}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const clock=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function tick(now){
  if(!S)return;
  if(S.paused){raf=requestAnimationFrame(tick);return}
  const ring=$("#ring");
  if(S.prep>0){
    const el=(now-S.begin)/1000, left=3.5-el;
    if(left<=0){S.prep=0;S.idx=-1;nextPhase(now)}
    else{$("#s-count").textContent=Math.ceil(Math.min(3,left));ring.style.strokeDashoffset=301.6*(1-el/3.5);
      $("#s-meta").textContent=F.metaPrep(S.rounds,dur)}
    raf=requestAnimationFrame(tick);return;
  }
  const [k,len]=S.p[S.idx];
  const tt=(now-S.phaseStart)/1000;
  if(tt>=len){ if(!nextPhase(S.phaseStart+len*1000))return; raf=requestAnimationFrame(tick);return}
  const fr=tt/len, tg=target(k);
  if(k==="pump"){ // saniyede bir veriş: hızlı küçül, yavaşça geri dol
    const n=Math.floor(tt), f=tt-n;
    if(n!==S.stroke){S.stroke=n;bell("tick");vib(15)}
    S.scale=f<.25?.86-(.24*f/.25):.62+.24*((f-.25)/.75);
  }else if(tg!=null)S.scale=S.from+(tg-S.from)*ease(fr);
  $("#orb").style.transform=`scale(${S.scale.toFixed(4)})`;$("#stage").style.setProperty("--s",S.scale.toFixed(4));
  ring.style.strokeDashoffset=(301.6*(1-fr)).toFixed(2);
  $("#s-count").textContent=Math.max(1,Math.ceil(len-tt));
  const done=((S.round-1)*S.cyc+S.p.slice(0,S.idx).reduce((s,x)=>s+x[1],0)+tt);
  $("#s-meta").textContent=F.meta(S.round,S.rounds,clock(Math.max(0,S.rounds*S.cyc-done)));
  S.elapsed=done;$("#s-bar").style.width=(Math.min(1,done/(S.rounds*S.cyc))*100).toFixed(2)+"%";
  raf=requestAnimationFrame(tick);
}
function finish(complete){
  cancelAnimationFrame(raf);
  if(!S)return;
  const sec=Math.round(S.elapsed||0);
  if(sec>=20){
    store.ses.push({id:uid(),t:new Date().toISOString(),egz:S.e.id,ad:X(S.e.ad),sn:sec,tur:complete?S.rounds:S.round-1,cyc:S.cyc,ptn:numsTxt(S.p)});
    save("ses");renderRapor();
  }
  const bug=daySecs(store.ses).get(dk(new Date()))||0, hedef=store.ayar.gunDk*60;
  bell("end"); if(complete)say(t("endSay")); else hush();
  $("#s-controls").hidden=true;$("#s-done").hidden=false;
  $("#s-sum").textContent=(sec>=20?F.saved(Math.floor(sec/60),sec%60):t("tooShortSes")+" ")
    +(bug>=hedef?F.todayOk(ztxt(bug)):F.todayLeft(ztxt(bug),store.ayar.gunDk,ztxt(hedef-bug)));
  $("#s-phase").textContent="";$("#s-count").textContent="";$("#s-hint").textContent="";
  $("#orb").style.transform="scale(.55)";$("#stage").style.setProperty("--s",.55);$("#ring").style.strokeDashoffset=301.6;$("#s-bar").style.width="0%";
  S=null; try{wake&&wake.release()}catch(e){} wake=null;
}
$("#s-pause").addEventListener("click",()=>{
  if(!S)return; const now=performance.now();
  if(!S.paused){S.paused=true;S.pauseAt=now;setPauseBtn(true);hush()}
  else{const d=now-S.pauseAt;S.phaseStart+=d;S.begin+=d;S.paused=false;setPauseBtn(false)}
});
$("#s-sound").addEventListener("click",()=>{soundOn=!soundOn;ls.set("sound",soundOn);setSoundBtn();if(!soundOn)hush()});
$("#s-stop").addEventListener("click",()=>finish(false));
$("#s-close").addEventListener("click",()=>{$("#session").hidden=true;document.body.style.overflow="";renderHome()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S&&!wake)lockWake()});

let mode=ls.get("mode","mic"), H={state:"idle"}, mic=null;
const sensEl=$("#sens"); sensEl.value=ls.get("sens",10);
sensEl.addEventListener("input",()=>{ls.set("sens",+sensEl.value);placeThr()});
function setMode(m){
  mode=m;ls.set("mode",m);

function prepHiss(){setMode(mode)}
function resetHiss(){H={state:"idle"};$("#hissbtn").classList.remove("live");$("#hisst").textContent=fmt(0);
  $("#hisslbl").textContent=t("hStart");$("#hissstatus").textContent="";}
function hissClick(){
  unlockAudio();
  if(mode==="elle"){
    if(H.state!=="run"){H={state:"run",t0:performance.now()};$("#hissbtn").classList.add("live");$("#hisslbl").textContent=t("hTapEnd");
      $("#hissstatus").textContent=t("hHiss");bell("in");hissLoop()}
    else{const sn=(performance.now()-H.t0)/1000;H.state="idle";record(sn,"elle")}
    return;
  }
  if(H.state==="idle"||H.state==="done")micStart();

function hissLoop(){
  if(H.state!=="run"||mode!=="elle")return;
  $("#hisst").textContent=fmt((performance.now()-H.t0)/1000);
  requestAnimationFrame(hissLoop);
}
async function micStart(){
  $("#hissstatus").textContent=t("micOpening");
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("yok");
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const a=ac(); const src=a.createMediaStreamSource(stream); const an=a.createAnalyser();
    an.fftSize=2048; an.smoothingTimeConstant=.3; src.connect(an);
    const bins=new Float32Array(an.frequencyBinCount), hz=a.sampleRate/an.fftSize;
    const lo=Math.floor(2500/hz), hi=Math.min(bins.length-1,Math.floor(10000/hz));
    mic={stream,an,bins,lo,hi,floor:-90,cal:[],t0:performance.now()};
    H={state:"cal"};$("#hissbtn").classList.remove("live");$("#hisslbl").textContent=t("quiet");
    $("#hissstatus").textContent=t("calibrating");
    micLoop();
  }catch(e){
    setMode("elle"); $("#hissstatus").textContent=t("micFail");
  }
}
function micStop(){
  if(mic){try{mic.stream.getTracks().forEach(x=>x.stop())}catch(e){} mic=null}
  if(H.state==="cal"||H.state==="arm"||H.state==="run")resetHiss();
}
function level(){
  mic.an.getFloatFrequencyData(mic.bins);
  let s=0,n=0; for(let i=mic.lo;i<=mic.hi;i++){const v=mic.bins[i];if(isFinite(v)){s+=Math.pow(10,v/10);n++}}
  return n?10*Math.log10(s/n):-120;
}
const thr=()=>mic?mic.floor+(+sensEl.value):0;
function placeThr(){if(!mic)return;const pct=v=>Math.max(0,Math.min(100,(v+100)/80*100));$("#meterthr").style.left=pct(thr())+"%"}
function micLoop(){
  if(!mic)return;
  const now=performance.now(), lv=level();
  $("#meterfill").style.width=Math.max(0,Math.min(100,(lv+100)/80*100))+"%";
  if(H.state==="cal"){
    mic.cal.push(lv);
    if(now-mic.t0>1100){const srt=mic.cal.slice().sort((a,b)=>a-b);mic.floor=srt[Math.floor(srt.length*.8)]||-90;placeThr();
      H={state:"arm",above:0};$("#hisslbl").textContent=t("readyBtn");$("#hissstatus").textContent=t("readyMsg");bell("in")}
  }else if(H.state==="arm"){
    if(lv>thr()){H.above=H.above||now; if(now-H.above>150){H={state:"run",t0:H.above,last:now};$("#hissbtn").classList.add("live");$("#hisslbl").textContent=t("listening");$("#hissstatus").textContent=t("keepGoing")}}
    else H.above=0;
  }else if(H.state==="run"){
    if(lv>thr()-2)H.last=now;
    $("#hisst").textContent=fmt((H.last-H.t0)/1000);
    if(now-H.last>700){record((H.last-H.t0)/1000,"mic");return}
    if(now-H.t0>180000){record((H.last-H.t0)/1000,"mic");return}
  }else return;
  requestAnimationFrame(micLoop);
}
function record(sn,how){
  if(mic){try{mic.stream.getTracks().forEach(x=>x.stop())}catch(e){} mic=null}
  sn=Math.round(sn*10)/10;
  $("#hissbtn").classList.remove("live");
  if(sn<2){H={state:"done"};$("#hisst").textContent=fmt(sn);$("#hisslbl").textContent=t("again");
    $("#hissstatus").textContent=t("tooShortH");return}
  const prevBest=store.hiss.reduce((m,x)=>Math.max(m,x.sn),0);
  store.hiss.push({id:uid(),t:new Date().toISOString(),sn,mod:how});
  save("hiss");
  H={state:"done"};$("#hisst").textContent=fmt(sn);$("#hisslbl").textContent=t("again");
  bell("end"); vib(120);
  const rec=prevBest&&sn>prevBest;
  $("#hissstatus").textContent=F.result(fmt(sn))+(rec?F.record(fmt(prevBest)):"");
  say(F.sayRes(fmt(sn))+(rec?F.sayRec():""));
  renderHiss();renderRapor();
}

/* ---------- Tarih yardımcıları ---------- */
const day=iso=>{const d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayTR=k=>{const [y,m,d]=k.split("-");return lang==="en"?`${+d}/${+m}/${y}`:`${+d}.${+m}.${y}`};
const dayShort=k=>dayTR(k).slice(0,-5);
const timeTR=iso=>new Date(iso).toLocaleTimeString(loc(),{hour:"2-digit",minute:"2-digit"});
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monOf=d=>{const x=sod(d);return addD(x,-((x.getDay()+6)%7))};
const dayDiff=(a,b)=>Math.round((sod(b)-sod(a))/864e5);
function ztxt(s){s=Math.round(s);if(s<=0)return "0 "+t("min");if(s<60)return s+" "+t("sec");const m=Math.round(s/60);return m<120?m+" "+t("min"):Math.floor(m/60)+" "+t("hr")+(m%60?" "+m%60+" "+t("min"):"")}
function daySecs(list){const m=new Map();list.forEach(x=>{const k=day(x.t);m.set(k,(m.get(k)||0)+x.sn)});return m}
const inR=(iso,a,b)=>{const d=new Date(iso);return d>=a&&d<b};
const pctTxt=(a,b)=>b>0?(lang==="en"?Math.round(a/b*100)+"%":"%"+Math.round(a/b*100)):"–";

/* ---------- Tıslama gelişimi ---------- */
let pendingDel=null;
function renderHiss(){
  const L2=store.hiss;
  if(!L2.length){
    $("#hstats").innerHTML=`<div class="stat" style="grid-column:1/-1"><div class="k">${t("noMeas")}</div><div class="note">${t("noMeasNote")}</div></div>`;

  }
  const by=new Map(); L2.forEach(x=>{const k=day(x.t);by.set(k,Math.max(by.get(k)||0,x.sn))});
  const days=[...by.keys()].sort(); const first=by.get(days[0]), last=by.get(days[days.length-1]);
  const best=Math.max(...L2.map(x=>x.sn)); const ch=first?((last-first)/first*100):0;

    [t("firstDay"),fmt(first)+sx,dayTR(days[0])],
    [t("lastDay"),fmt(last)+sx,dayTR(days[days.length-1])],

  ].map((s,i)=>`<div class="stat"><div class="k">${s[0]}</div><div class="v ${i===3?(ch>0?"up":ch<0?"down":""):""}">${s[1]}</div><div class="note">${s[2]}</div></div>`).join("");

  const rows=L2.slice().reverse().map(r=>`<tr><td>${dayTR(day(r.t))}</td><td>${timeTR(r.t)}</td><td>${r.mod==="mic"?t("mic"):t("hand")}</td><td class="r"><b>${fmt(r.sn)}</b>${sx}${r.sn===best?" ★":""}</td>
    <td class="r">${pendingDel===r.id?`<span class="confirm"><button class="btn small" data-del="${r.id}">${t("del")}</button><button class="btn small ghost" data-cancel="1">${t("cancel")}</button></span>`:`<button class="x" data-ask="${r.id}" aria-label="${t("delAria")}">✕</button>`}</td></tr>`).join("");
  $("#hlist").innerHTML=`<div class="chart"><table><thead><tr><th>${t("thDate")}</th><th>${t("thTime")}</th><th>${t("thMeas")}</th><th class="r">${t("thDur")}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

  $("#hlist").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{store.hiss=store.hiss.filter(x=>x.id!==b.dataset.del);pendingDel=null;save("hiss");renderHiss();renderRapor()}));
}

/* ---------- Grafik yardımcıları ---------- */
function niceMax(v){if(!(v>0))return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}
function lineSVG(pts,vf,aria){
  const W=640,Hh=220,pl=44,pr=16,pt=20,pb=30,n=pts.length;
  const mx=niceMax(Math.max(...pts.map(p=>p.v))*1.05);
  const x=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1);
  const y=v=>pt+(Hh-pt-pb)*(1-v/mx);
  let g="";
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v,v%1?1:0)}</text>`}
  const P=pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`);
  const area=n>1?`<path d="M${x(0)},${y(0)} L${P.join(" L")} L${x(n-1)},${y(0)} Z" fill="var(--accent)" opacity=".12"/>`:"";
  const line=n>1?`<polyline points="${P.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`:"";
  const step=Math.max(1,Math.ceil(n/7));
  const lab=pts.map((p,i)=>((i%step===0&&n-1-i>=step/2)||i===n-1)?`<text x="${x(i)}" y="${Hh-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.l)}</text>`:"").join("");
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===n-1?5:3}" fill="${i===n-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"><title>${esc(p.tt||p.l)}</title></circle>`).join("");
  const lv=pts[n-1].v;
  const lastLab=`<text x="${Math.min(x(n-1),W-pr-4)}" y="${y(lv)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--fg)">${esc(vf(lv))}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(aria)}">${g}${area}${line}${dots}${lab}${lastLab}</svg>`;
}
function barSVG(bk,aria){
  const W=640,Hh=230,pl=44,pr=16,pt=16,pb=30,n=bk.length;
  const mx=niceMax(Math.max(...bk.map(b=>Math.max(b.v,b.goal)))*1.08);
  const cw=(W-pl-pr)/n, bw=Math.max(2,Math.min(38,cw*.66));
  const y=v=>pt+(Hh-pt-pb)*(1-v/mx);
  let g="";
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v,v%1?1:0)}</text>`}
  const same=bk.every(b=>Math.abs(b.goal-bk[0].goal)<.01);
  let bars="",goals="",lab="";
  const step=Math.max(1,Math.ceil(n/12)), mn=" "+t("min");
  bk.forEach((b,i)=>{
    const cx=pl+cw*i+cw/2, ok=b.v>=b.goal&&b.v>0;

function range(){

  if(per==="ay")return[new Date(tday.getFullYear(),tday.getMonth(),1),new Date(tday.getFullYear(),tday.getMonth()+1,1)];
  if(per==="30")return[addD(tday,-29),addD(tday,1)];
  if(per==="yil")return[new Date(tday.getFullYear(),0,1),new Date(tday.getFullYear()+1,0,1)];
  if(per==="tumu"){const all=[...store.ses,...store.hiss].map(x=>new Date(x.t));const f=all.length?sod(new Date(Math.min(...all))):tday;return[f,addD(tday,1)]}

function buckets(a,b,list){

  else if(kind==="hafta")for(let w=monOf(a);w<b;w=addD(w,7))out.push({a:w,b:addD(w,7),l:dayShort(dk(w)),tt:`${dayTR(dk(w))} ${t("weekOf")}`,goal:A.gunDk*A.haftaGun});

  theme=theme==="auto"?"light":theme==="light"?"dark":"auto";ls.set("theme",theme);applyTheme();
}));

/* ---------- Ana ekran ---------- */
const HOMEDUR=[1,3,5,10];
function daySlot(){const h=new Date().getHours();return h>=5&&h<11?0:h>=11&&h<17?1:h>=17&&h<21?2:3}
function suggest(){
  const fav=(store.ayar.fav||[]).filter(id=>EX.some(e=>e.id===id));
  if(fav.length)return{id:fav[0],why:t("whyFav")};
  const s=daySlot();
  return{id:["rez","kutu","uzun","478"][s],why:t("whyTime")[s]};
}
let homeEx=null, orbInhale=true;
function startHome(id){const e=EX.find(x=>x.id===id);if(!e)return;unlockAudio();start(e)}
function renderHome(){
  if(!$("#v-ana"))return;
  const now=new Date(), h=now.getHours();
  $("#h-date").textContent=now.toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"});
  $("#h-greet").textContent=t("greet")[h>=5&&h<12?0:h>=12&&h<18?1:h>=18&&h<22?2:3];
  const sg=suggest(), e=EX.find(x=>x.id===sg.id), p=patternOf(e); homeEx=e.id;
  $("#h-ex").textContent=X(e.ad);
  $("#h-why").textContent=sg.why;
  $("#h-exds").textContent=X(e.ds);
  $("#h-rhythm").innerHTML=rhythmHTML(p).replace(/^<div class="rhythm">|<\/div>$/g,"");
  const ds=HOMEDUR.includes(dur)?HOMEDUR:HOMEDUR.concat(dur).sort((a,b)=>a-b);
  $("#h-dur").setAttribute("aria-label",t("duration"));
  $("#h-dur").innerHTML=ds.map(d=>`<button class="chip" data-hd="${d}" aria-pressed="${d===dur}">${d} ${t("min")}</button>`).join("");
  $("#h-orb").setAttribute("aria-label",t("orbAria")+": "+X(e.ad));
  $("#h-orbtxt").textContent=orbInhale?t("orbIn"):t("orbOut");

  // Bugün
  const A=store.ayar, dm=daySecs(store.ses), todayS=dm.get(dk(now))||0, g=A.gunDk*60, W=weekInfo(monOf(now),dm), WD=t("wd");
  const pr=Math.min(1,todayS/g), C=226.2;
  $("#h-today").innerHTML=`<p class="eyebrow">${t("todayTitle")}</p>
    <div class="todayrow">
      <svg class="ringsvg" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="5"/>
        <circle cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-pr)).toFixed(1)}" opacity="${pr>0?1:0}" transform="rotate(-90 42 42)"/></svg>
      <div><div class="bignum">${Math.round(todayS/60)}<span class="note" style="font-family:var(--f-body);font-size:1rem;font-weight:500"> / ${A.gunDk} ${t("min")}</span></div>
      <p class="note">${F.wkSum2(W.ok,A.haftaGun)}</p></div>
    </div>
    <div class="dots" aria-hidden="true">${W.days.map((x,i)=>`<span class="${x.ok?"ok":x.s>0?"some":""}${x.today?" today":""}"><i></i>${WD[i]}</span>`).join("")}</div>
    <button class="linkbtn" data-go="gecmis">${t("seeProgress")} ${ic("arrow","sm")}</button>`;

  // Favoriler ya da sık yapılanlar
  let ids=(store.ayar.fav||[]).filter(id=>EX.some(x=>x.id===id)).slice(0,4), title=t("favTitle");
  if(!ids.length){const c={};store.ses.forEach(x=>{if(EX.some(y=>y.id===x.egz))c[x.egz]=(c[x.egz]||0)+1});
    ids=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,3); title=ids.length?t("recentTitle"):t("favTitle")}
  $("#h-fav").innerHTML=`<p class="eyebrow">${title}</p>`+(ids.length?`<div class="quick">${ids.map(id=>{const x=EX.find(y=>y.id===id),pp=patternOf(x);
      return `<button data-start="${id}" aria-label="${t("start")}: ${esc(X(x.ad))}"><span class="qn"><b>${esc(X(x.ad))}</b><span>${numsTxt(pp)} ${t("sec")} · ${dur} ${t("min")}</span></span><span class="qp">${ic("play","sm")}</span></button>`}).join("")}</div>`
    :`<p class="note">${t("favEmpty")}</p>`)+`<button class="linkbtn" data-go="egzersiz">${t("browseAll")} ${ic("arrow","sm")}</button>`;

  // Nefes kapasitesi
  const HS=store.hiss, sx=" "+t("sec");
  $("#h-hiss").innerHTML=`<p class="eyebrow">${t("hissHomeTitle")}</p>`+(HS.length?(()=>{const l=HS[HS.length-1],b=Math.max(...HS.map(x=>x.sn)),f=HS[0].sn,ch=f?Math.round((b-f)/f*100):0;
      return `<div><div class="bignum">${fmt(l.sn)}<span class="note" style="font-family:var(--f-body);font-size:1rem;font-weight:500">${sx}</span></div>
      <p class="note">${t("hissLastLbl")} · ${dayTR(day(l.t))}</p></div>
      <p class="note">${t("hissBestLbl")} <b style="color:var(--fg)">${fmt(b)}${sx}</b>${ch>0?` · <span class="up">+${ch}%</span>`:""}</p>`})()
    :`<p class="note">${t("hissNone")}</p>`)+`<button class="linkbtn" data-go="tislama">${t("measureNow")} ${ic("arrow","sm")}</button>`;

  // Etiketler
  $("#s-stop").setAttribute("aria-label",t("endA"));
  applyTheme();
}
$("#v-ana").addEventListener("click",ev=>{
  const go=ev.target.closest("[data-go]"); if(go){const v=go.dataset.go;location.hash=v;show(v);return}
  const st=ev.target.closest("[data-start]"); if(st){startHome(st.dataset.start);return}
  const hd=ev.target.closest("[data-hd]"); if(hd){dur=+hd.dataset.hd;ls.set("dur",dur);renderHome();return}
});
$("#h-start").addEventListener("click",()=>startHome(homeEx));
$("#h-orb").addEventListener("click",()=>startHome(homeEx));
$("#h-other").addEventListener("click",()=>{location.hash="egzersiz";show("egzersiz")});
// Ana ekrandaki küre 10 sn'lik döngüde nefes alır ve verir; yazı da ona eşlik eder
{const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
 if(!reduce)setInterval(()=>{orbInhale=!orbInhale;const el=$("#h-orbtxt");if(el)el.textContent=orbInhale?t("orbIn"):t("orbOut")},5000);}

function renderAll(){renderList();renderHiss();renderRapor();renderHome()}
